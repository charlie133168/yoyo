<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>免费解读预约 - 暖心心理疗愈咨询</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --color-beige: #F9F5F1;
      --color-milktea: #E8D9CF;
      --color-pink: #F4EAE8;
      --color-green: #E6F0EA;
    }
  </style>
</head>
<body class="bg-[var(--color-beige)] text-gray-800">
  <header class="bg-[var(--color-milktea)] shadow-md">
    <div class="container mx-auto flex justify-between items-center p-4">
      <h1 class="text-2xl font-bold">暖心心理疗愈</h1>
      <nav>
        <ul class="flex space-x-4">
          <li><a href="index.html" class="hover:text-pink-400">首页</a></li>
          <li><a href="about.html" class="hover:text-pink-400">关于我</a></li>
          <li><a href="services.html" class="hover:text-pink-400">服务与价格</a></li>
          <li><a href="form.html" class="hover:text-pink-400">免费解读预约</a></li>
          <li><a href="blog.html" class="hover:text-pink-400">博客文章</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="container mx-auto py-12 max-w-xl">
    <h2 class="text-3xl font-bold mb-6 text-center">免费生辰解读预约</h2>
    <form id="bookingForm" class="bg-[var(--color-milktea)] p-8 rounded-xl shadow space-y-4">
      <div><label for="name" class="block mb-1 font-semibold">姓名 *</label><input type="text" id="name" name="name" class="w-full p-2 rounded border border-gray-300" required></div>
      <div><label for="gender" class="block mb-1 font-semibold">性别 *</label><select id="gender" name="gender" class="w-full p-2 rounded border border-gray-300" required><option value="">请选择</option><option value="女">女</option><option value="男">男</option></select></div>
      <div><label for="birthdate" class="block mb-1 font-semibold">出生年月日 *</label><input type="date" id="birthdate" name="birthdate" class="w-full p-2 rounded border border-gray-300" required></div>
      <div><label for="birthtime" class="block mb-1 font-semibold">出生时间 *</label><input type="time" id="birthtime" name="birthtime" class="w-full p-2 rounded border border-gray-300" required></div>
      <div><label for="birthplace" class="block mb-1 font-semibold">出生地点 *</label><input type="text" id="birthplace" name="birthplace" class="w-full p-2 rounded border border-gray-300" required></div>
      <div><label for="phone" class="block mb-1 font-semibold">联系方式（手机号） *</label><input type="tel" id="phone" name="phone" placeholder="例：13812345678" class="w-full p-2 rounded border border-gray-300" required pattern="^1[3-9]\d{9}$"></div>
      <div><label for="issue" class="block mb-1 font-semibold">主要困扰 *</label><textarea id="issue" name="issue" class="w-full p-2 rounded border border-gray-300" rows="3" required></textarea></div>
      <button type="submit" class="bg-[var(--color-pink)] w-full py-2 rounded-full hover:shadow-lg transition">提交预约</button>
    </form>
  </section>

  <footer class="bg-[var(--color-milktea)] py-6 mt-12 text-center text-gray-600">
    &copy; 2026 暖心心理疗愈 | <a href="about.html" class="hover:text-pink-400">关于我</a>
  </footer>

  <script>
    const form = document.getElementById('bookingForm');
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const name = form.name.value.trim();
      const gender = form.gender.value;
      const birthdate = form.birthdate.value;
      const birthtime = form.birthtime.value;
      const birthplace = form.birthplace.value.trim();
      const phone = form.phone.value.trim();
      const issue = form.issue.value.trim();
      const phoneRegex = /^1[3-9]\d{9}$/;
      if (!name || !gender || !birthdate || !birthtime || !birthplace || !phone || !issue) { alert('请完整填写所有必填项'); return; }
      if (!phoneRegex.test(phone)) { alert('请输入有效手机号'); return; }
      console.log({name, gender, birthdate, birthtime, birthplace, phone, issue});
      alert('预约提交成功，我们会尽快联系您！');
      form.reset();
    });
  </script>
</body>
</html>
